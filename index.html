<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q2 Drill 1</title>
</head>
<style>
    body{
        background-image: url(https://t3.ftcdn.net/jpg/04/46/65/06/360_F_446650676_BqS3AgYlcCUDXo7IfN3nAinIp1Rpd303.jpg);
        background-size: cover;
    }
    h2{
        font-weight: 700;
    }
    h2, .col-3{
        background-color: rgb(35, 100, 200);
        border-radius: 15px;
        padding: 5px;
        box-shadow: 5px 5px 10px 1px ;
    }
    h5{
        background-color: rgb(255, 255, 50);
        border-radius: 5px;
    }
    img{
        width: 200px;
        height: 200px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
</style>
<body>
    <div class="container pt-5">
        <h2 class="text-center">Beginner's Guide to Volleyball</h2>
        <br><br>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXZz8Gq54wHFV_jIzcI0_iR72dOlVc_ga8Km7Kf7qKrw&s=10">
    </div>

    <div class="container pt-5">
        <div class="row gap-4 justify-content-center">
            <div class="col-3 p-3 border rounded bg-white vh-50">
                <h5>Basic Rules</h5>
                <ul>
                    <li>Service before the line</li>
                    <li>Rotation of players</li>
                    <li>No net touch</li>
                    <li>No ball bounce</li>
                </ul>
    </div>

    <div class="col-3 p-3 border rounded bg-white vh-50">
        <h5>Basic Techniques</h5>
        <ul>
            <li>Spiking</li>
            <li>Setting</li>
            <li>Blocking</li>
            <li>Passing</li>
        </ul>
    </div>

    <div class="col-3 p-3 border rounded bg-white vh-50">
        <h5>Basic Equipment</h5>
        <ul>
            <li>Ball</li>
            <li>Net</li>
            <li>Post</li>
            <li>Court</li>
        </ul>
    </div>
</body>
</html>
